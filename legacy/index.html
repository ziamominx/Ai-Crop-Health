/* ============================= STORAGE (browser localStorage) =============================
   NOTE: This replaces Claude.ai's artifact-only `window.storage` API with a version that
   works in any real browser via localStorage, so this runs correctly once deployed on
   GitHub Pages / Vercel / Netlify etc.
   Caveat: localStorage is per-browser, per-device — it is NOT shared across different
   farmers' phones. For a real multi-device "officer sees every farmer's report" demo,
   swap this out for a real backend (Firebase, Supabase, or your own API) later. For a
   single-device SIH demo (one laptop/phone showing both roles) this works perfectly. */
const storage = {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v } : null;
    } catch { return null; }
  },
  async set(key, value) {
    try { localStorage.setItem(key, value); return { key, value }; }
    catch { return null; }
  },
  async list(prefix = "") {
    try {
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix));
      return { keys };
    } catch { return { keys: [] }; }
  },
  async delete(key) {
    try { localStorage.removeItem(key); return { key, deleted: true }; }
    catch { return null; }
  },
};

function resizeImageFile(file, maxW = 320) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = () => reject(new Error("image load failed"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("file read failed"));
    reader.readAsDataURL(file);
  });
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }

function runAnalysis({ crop }) {
  const isHealthy = Math.random() < 0.18;
  const diseaseList = DISEASE_MAP[crop] || ["Unidentified Stress"];
  const disease = isHealthy ? null : pick(diseaseList);
  const confidence = isHealthy ? randInt(90, 99) : randInt(64, 98);
  const severity = pick(["Low", "Moderate", "High"]);
  const humidity = randInt(50, 92);
  const rainfall = randInt(0, 22);
  const temp = randInt(24, 34);
  let risk = "Low";
  if (humidity > 75 && rainfall > 4) risk = "High";
  else if (humidity > 60) risk = "Moderate";
  const lowConfidence = !isHealthy && confidence < 78;
  const followupDays = severity === "High" ? 2 : severity === "Moderate" ? 4 : 7;
  return {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    crop, disease, isHealthy, confidence, severity, risk,
    humidity, rainfall, temp, lowConfidence, followupDays,
    verified: !lowConfidence,
    timestamp: new Date().toISOString(),
  };
}

function riskColor(risk) {
  if (risk === "High") return C.red;
  if (risk === "Moderate") return C.amber;
  return C.green;
}

              <p className="text-xs font-semibold mb-3 flex items-center gap-1.5" style={{ color: "rgba(20,35,26,0.55)" }}><Stethoscope size={14} /> {t("referralQueueTitle")}</p>
              {referrals.length === 0 ? (
                <p className="text-sm" style={{ color: "rgba(20,35,26,0.5)" }}>{t("referralEmpty")}</p>
              ) : (
                <div className="space-y-2">
                  {referrals.map((r) => (
                    <div key={r.id} className="flex items-center justify-between gap-2 text-sm py-2 border-b" style={{ borderColor: C.line }}>
                      <div>
                        <div className="font-medium">{r.farmerName} · {r.crop}{r.disease ? ` · ${r.disease}` : ""}</div>
                        <div className="text-xs" style={{ color: "rgba(20,35,26,0.5)" }}><MapPin size={11} className="inline mr-1" />{r.location} — {r.reason}</div>
                      </div>
                      {r.resolved ? (
                        <Pill color={C.green}>{t("resolvedStatus")}</Pill>
                      ) : (
                        <div className="flex items-center gap-2 flex-shrink-0">
                          <Pill color={C.amber}>{t("pendingReferral")}</Pill>
                          <button onClick={() => resolveReferral(r)} className="text-xs font-semibold underline" style={{ color: C.forest }}>{t("resolveBtn")}</button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* ---- Model improvement loop ---- */}
            <div className="rounded-xl p-5 mb-6" style={{ background: C.forest }}>
              <p className="text-sm font-semibold mb-1 flex items-center gap-2 text-white"><BrainCog size={16} color={C.wheat} /> {t("modelLoopTitle")}</p>
              <p className="text-xs mb-4 text-white/65">{t("modelLoopDesc")}</p>
              <div className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <HistoryIcon size={16} color={C.wheat} />
                  <span className="text-white text-sm"><strong>{correctionsLog}</strong> {t("correctionsLabel")}</span>
                </div>
                <button onClick={sendRetrainBatch} disabled={retrainQueued} className="ag-body inline-flex items-center gap-2 rounded-full px-4 py-2 text-xs font-semibold" style={{ background: C.wheat, color: C.forestDark, opacity: retrainQueued ? 0.7 : 1 }}>
                  {retrainQueued ? <RefreshCw size={13} className="animate-spin" /> : <TrendingUp size={13} />}
                  {t("retrainBtn")}
                </button>
              </div>
              {retrainQueued && (
                <p className="text-xs mt-2 text-white/80">{t("retrainingMsg")}</p>
              )}
            </div>

            <div className="rounded-xl p-5" style={{ background: C.white, border: `1px solid ${C.line}` }}>
              <p className="text-xs font-semibold mb-3" style={{ color: "rgba(20,35,26,0.55)" }}>{t("recentReports")}</p>
              {officerLoading ? (
                <p className="text-sm" style={{ color: "rgba(20,35,26,0.5)" }}>{t("loadingReports")}</p>
              ) : reports.length === 0 ? (
                <p className="text-sm" style={{ color: "rgba(20,35,26,0.5)" }}>{t("noReports")}</p>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-left" style={{ color: "rgba(20,35,26,0.5)" }}>
                        <th className="py-2 pr-3 font-medium">{t("tblFarmer")}</th>
                        <th className="py-2 pr-3 font-medium">{t("tblCrop")}</th>
                        <th className="py-2 pr-3 font-medium">{t("tblIssue")}</th>
                        <th className="py-2 pr-3 font-medium">{t("tblSeverity")}</th>
                        <th className="py-2 pr-3 font-medium">{t("tblRisk")}</th>
                        <th className="py-2 pr-3 font-medium">{t("tblStatus")}</th>
                        <th className="py-2 pr-3 font-medium">{t("tblAction")}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {reports.slice(0, 15).map((r) => (
                        <React.Fragment key={r.id}>
                          <tr style={{ borderTop: `1px solid ${C.line}` }}>
                            <td className="py-2 pr-3">{r.farmerName || "—"}</td>
                            <td className="py-2 pr-3">{r.crop}</td>
                            <td className="py-2 pr-3 flex items-center gap-1">
                              {r.isHealthy ? t("healthy") : r.disease}
                              {r.sensor && <Wifi size={11} color={C.moss} title={t("tblSensor")} />}
                              {r.officerCorrected && <Pill color={C.forest}>✓</Pill>}
                            </td>
                            <td className="py-2 pr-3">{t(`severity_${r.severity}`)}</td>
                            <td className="py-2 pr-3"><Pill color={riskColor(r.risk)}>{t(`severity_${r.risk}`)}</Pill></td>
                            <td className="py-2 pr-3">
                              {r.verified ? <span style={{ color: C.green }}>{t("verified")}</span> : <span style={{ color: C.amber }}>{t("pending")}</span>}
                            </td>
                            <td className="py-2 pr-3">
                              {!r.verified && correctingId !== r.id && (
                                <div className="flex items-center gap-2">
                                  <button onClick={() => verify(r)} className="text-xs font-semibold underline" style={{ color: C.forest }}>{t("agreeBtn")}</button>
                                  <button onClick={() => { setCorrectingId(r.id); setCorrectionChoice((DISEASE_MAP[r.crop] || [])[0] || ""); }} className="text-xs font-semibold underline" style={{ color: C.amber }}>{t("correctBtn")}</button>
                                </div>
                              )}
                            </td>
                          </tr>
                          {correctingId === r.id && (
                            <tr style={{ background: C.creamDeep }}>
                              <td colSpan={7} className="py-2 px-3">
                                <div className="flex flex-wrap items-center gap-2">
                                  <span className="text-xs font-semibold">{t("selectActualLabel")}</span>
                                  <select value={correctionChoice} onChange={(e) => setCorrectionChoice(e.target.value)} className="rounded-lg px-2 py-1 text-xs" style={{ border: `1px solid ${C.line}` }}>
                                    {(DISEASE_MAP[r.crop] || []).map((d) => <option key={d} value={d}>{d}</option>)}
                                  </select>
                                  <button onClick={() => verify(r, correctionChoice)} className="text-xs font-semibold rounded-full px-3 py-1.5" style={{ background: C.forest, color: "white" }}>{t("verifyBtn")}</button>
                                  <button onClick={() => setCorrectingId(null)} className="text-xs underline" style={{ color: "rgba(20,35,26,0.5)" }}>✕</button>
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AgricureApp />);

</script>
